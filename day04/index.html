<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="description" content="머니프리랩 DAY 04 미션 — 최근 소비 하나로 소비일기를 쓰고, 내 지갑이 열리는 순간을 찾아 인증 이미지를 저장하세요.">
<title>MONEY FREE LAB · DAY 04</title>

<style>
@font-face{font-family:"Pretendard Variable";src:url("PretendardVariable.woff2") format("woff2");font-weight:45 920;font-display:swap}
:root{
  --bg:#080808;--card:#141414;--card2:#1E1E1E;--accent:#14FA32;--ink:#03210A;
  --fg:#F5F5F5;--muted:#A3A3A3;--line:#303030;--faint:#6B6B6B;--warn:#14FA32;--err:#14FA32;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;letter-spacing:-0.035em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;letter-spacing:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{width:100%;max-width:680px;margin:0 auto;padding-inline:20px}
.topbar{border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;padding-block:16px}
.brand{font-weight:800;font-size:15px;letter-spacing:-0.02em}
.day{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.hero{padding-block:44px 4px}
.hero-title{font-size:clamp(38px,11vw,76px);font-weight:800;letter-spacing:-0.06em;line-height:.96}
.hero-mission{margin-top:28px;font-size:15px;font-weight:700;color:var(--muted)}
.hero-copy{margin-top:8px;font-size:clamp(22px,5.6vw,30px);font-weight:800;line-height:1.35;letter-spacing:-0.045em}
.hero-sub{margin-top:10px;color:var(--muted)}
.meta{list-style:none;padding:0;margin:20px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.meta li{font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px;letter-spacing:-0.01em}
.mini-title{margin-top:24px;font-size:15px;font-weight:800;color:var(--muted)}

.progress{margin-top:28px}
.progress ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.progress button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;width:100%;padding-block:4px}
.progress button:disabled{cursor:default}
.pbar{height:4px;border-radius:2px;background:var(--line);margin-bottom:6px}
.done .pbar,.current .pbar{background:var(--accent)}
.pk{font-size:12px;font-weight:700;letter-spacing:0;color:var(--faint)}
.current .pk{color:var(--accent)}.done .pk{color:var(--muted)}
.pt{font-size:14px;font-weight:700;color:var(--faint)}
.current .pt,.done .pt{color:var(--fg)}

.step{padding-block:32px 8px}
.eyebrow{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:0}
.step h2{margin-top:6px;font-size:clamp(24px,6vw,30px);font-weight:800;line-height:1.3;letter-spacing:-0.05em}
.lead{margin-top:10px;color:var(--muted)}
.card{background:var(--card);border-radius:20px;padding:22px 20px;margin-top:20px}
.field+.field{margin-top:22px}
.label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px;font-weight:800}
.label small{font-weight:600;color:var(--muted);font-size:13px}
.input{margin-top:10px;width:100%;background:var(--card2);border:1.5px solid transparent;border-radius:14px;padding:15px 16px;font-size:17px;font-weight:600;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:#5f5f5f;font-weight:500}
textarea.input{resize:none;min-height:92px;line-height:1.55}
.money{position:relative}.money .input{padding-right:46px;text-align:right}
.money span{position:absolute;right:16px;top:50%;transform:translateY(-35%);color:var(--muted);font-weight:700}
.help{margin-top:8px;font-size:13px;color:var(--muted)}
.count{font-size:12px;color:var(--faint);text-align:right;margin-top:6px;letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);border-radius:999px;padding:9px 15px;font-size:15px;font-weight:700;color:var(--fg);transition:background .15s,border-color .15s}
.chip:hover{border-color:#555}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toggle{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.type{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card2);border:1.5px solid transparent;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px;min-height:112px}
.type b{font-size:20px;font-weight:800;letter-spacing:-0.04em}
.type i{font-style:normal;font-size:11px;font-weight:800;color:var(--faint);letter-spacing:.06em}
.type span{font-size:13px;color:var(--muted);line-height:1.45}
.type[aria-pressed="true"]{background:var(--accent);color:var(--ink)}
.type[aria-pressed="true"] i,.type[aria-pressed="true"] span{color:var(--ink)}
.type:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.worth{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.worth button{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card2);border:1.5px solid transparent;border-radius:14px;padding:14px 6px;text-align:center;font-weight:800;font-size:15px}
.worth button em{display:block;font-style:normal;font-size:24px;line-height:1.2}
.worth button[aria-pressed="true"]{background:var(--accent);color:var(--ink)}
.hint{margin-top:14px;border:1px solid #1f5a28;background:#0c1a0e;color:var(--accent);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600}
.sentence{margin-top:12px;background:var(--card2);border-radius:16px;padding:16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:18px;font-weight:800}
.sentence input{flex:1 1 180px;min-width:0;background:transparent;border:none;border-bottom:2px solid var(--accent);padding:6px 2px;font-size:18px;font-weight:800;outline:none}
.sentence input::placeholder{color:#5f5f5f;font-weight:600}
.sugg{margin-top:10px;font-size:13px;color:var(--muted);font-weight:600}
.nav{display:flex;gap:10px;padding-block:28px 40px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;border-radius:16px;padding:17px 20px;font-weight:800;font-size:17px}
.btn.primary{flex:1;background:var(--accent);color:var(--ink)}
.btn.primary:disabled{background:#2a2a2a;color:#666;cursor:not-allowed}
.btn.ghost{background:var(--card2);color:var(--fg)}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.err{margin-top:10px;color:var(--err);font-size:13px;font-weight:700;min-height:1em}
.preview{margin-top:20px;background:var(--card);border-radius:20px;padding:18px}
.preview canvas{width:100%;height:auto;display:block;border-radius:12px}
.preview p{margin-top:10px;font-size:13px;color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.actions .btn{width:100%}
.btn.outline{border:1.5px solid var(--line);color:var(--fg)}
.note{margin-top:12px;font-size:13px;color:var(--muted)}
.note b{color:var(--warn);font-weight:700}
.linkbtn{all:unset;cursor:pointer;color:var(--muted);text-decoration:underline;font-size:14px;font-weight:600}
footer{border-top:1px solid var(--line);margin-top:24px}
footer .wrap{padding-block:22px 40px;font-size:13px;color:var(--faint)}
.counters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctr{background:var(--card2);border-radius:16px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:2px}
.ctr i{font-style:normal;font-size:11px;font-weight:800;color:var(--faint);letter-spacing:.06em}
.ctr b{font-size:19px;font-weight:800;letter-spacing:-0.04em}
.ctr small{font-size:12px;color:var(--muted);line-height:1.4;min-height:2.8em}
.ctr .row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.ctr .row button{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;background:#2a2a2a;color:var(--fg)}
.ctr .row button.plus{background:var(--accent);color:var(--ink)}
.ctr .row button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.ctr .row output{flex:1;text-align:center;font-size:30px;font-weight:800;letter-spacing:-0.04em;font-variant-numeric:tabular-nums}
.tally{margin-top:16px}
.tally .tl{display:flex;justify-content:space-between;font-size:14px;font-weight:800}
.tally .tl span{color:var(--muted);font-weight:700}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--card2);margin-top:8px}
.stack i{display:block;height:100%;transition:width .2s}
.howto{margin-top:12px;background:var(--card);border-radius:16px;padding:14px 16px;font-size:14px;color:var(--muted);line-height:1.6}
.howto b{color:var(--fg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="topbar"><div class="wrap"><span class="brand">MONEY FREE LAB</span><span class="day">DAY 04 / MISSION</span></div></header>
<main class="wrap" id="app"></main>
<footer><div class="wrap">© MONEY FREE LAB | 머니프리랩 제작<br>입력한 내용은 서버로 보내지 않고 이 기기에만 저장되며, 3일이 지나면 자동으로 지워져요.</div></footer>

<script>
(function(){
const KEY='mfl-day04-diary-v2', TTL=3*24*3600*1000;
const FEELINGS=['지침·피곤','스트레스','심심함','불안·조급','외로움','신남·설렘','뿌듯함','비교·부러움'];
const REASONS=['꼭 필요해서','할인·한정이라서','남들 다 있어서','나한테 주는 보상','그냥 습관처럼','나를 키우려고'];
const TIMES=['아침','점심','오후','저녁','밤','새벽'];
const TYPES=[
 {k:'need',n:'필요',e:'NEED',d:'생활에 꼭 필요한 것'},
 {k:'grow',n:'투자',e:'GROW',d:'나를 키우거나 시간을 사는 것'},
 {k:'feel',n:'감정',e:'FEEL',d:'그때 기분 때문에 산 것'},
 {k:'auto',n:'습관',e:'AUTO',d:'생각 없이 반복되는 것'}];
const STATUS=['잘 쓰고 있다','아직 방치 중','이미 다 썼다'];
const WORTH=[{k:'yes',s:'○',n:'있었다'},{k:'meh',s:'△',n:'애매하다'},{k:'no',s:'✕',n:'아깝다'}];
const TRIG={'지침·피곤':'지치고 피곤할','스트레스':'스트레스 받을','심심함':'심심할','불안·조급':'불안하고 조급할','외로움':'외로울','신남·설렘':'기분이 들뜰','뿌듯함':'뭔가 해냈을','비교·부러움':'남과 비교될'};
const RTRIG={'할인·한정이라서':'할인·한정 알림을 볼','남들 다 있어서':'남들이 다 가진 걸 볼','나한테 주는 보상':'나한테 보상해주고 싶을','그냥 습관처럼':'아무 생각 없이 폰을 볼'};
const STEPS=['7일 분류','무엇을','그때 나는','돈값','깨달음'];
const TCOL={need:'#F5F5F5',grow:'#14FA32',feel:'#9A9A94',auto:'#4E4E4A'};
const blank=()=>({v:2,saved:Date.now(),step:0,cnt:{need:0,grow:0,feel:0,auto:0},note:'',date:today(),time:'',item:'',amount:'',hideAmount:true,where:'',feel:[],reason:[],why:'',type:'',status:'',worth:'',worthWhy:'',trigger:'',next:''});
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&r.v===2&&Date.now()-r.saved<TTL)return Object.assign(blank(),r)}catch(e){}return blank()}
function save(){S.saved=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function reset(){try{localStorage.removeItem(KEY)}catch(e){}S=blank();render();window.scrollTo(0,0)}
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtWon(v){const n=Number(String(v).replace(/[^0-9]/g,''));return n?n.toLocaleString('ko-KR'):''}
function dateLabel(d){if(!d)return '';const t=new Date(d+'T00:00:00');if(isNaN(t))return d;return (t.getMonth()+1)+'월 '+t.getDate()+'일 '+'일월화수목금토'[t.getDay()]+'요일'}
const total=()=>Object.values(S.cnt).reduce((a,b)=>a+b,0);
function valid(i){if(i===0)return total()>=3;if(i===1)return S.item.trim().length>0;if(i===2)return S.feel.length+S.reason.length>0;if(i===3)return !!S.type&&!!S.worth;if(i===4)return S.trigger.trim().length>0;return true}

function hero(){return `<section class="hero">
<h1 class="hero-title">MONEY<br>HAS FEELINGS.</h1>
<p class="hero-mission">DAY 04. 소비는 감정이다</p>
<p class="hero-copy">일주일 소비를 넓게 보고, 한 건은 깊게.<br>내 지갑이 열리는 순간을 찾아봐요.</p>
<p class="hero-sub">잘했다, 못했다 평가는 잠시 내려놓고 그때의 기분을 솔직하게 적어보세요.</p>
<ul class="meta"><li>5단계 · 10~15분</li><li>카드·페이 앱 준비</li><li>금액은 안 적어도 OK</li><li>마지막에 인증 이미지 저장</li><li>입력 내용은 내 기기에만 저장</li></ul>
</section>`}
function progress(){return `<nav class="progress" aria-label="진행 단계"><ol>${STEPS.map((t,i)=>{const cls=i<S.step?'done':i===S.step?'current':'';const can=i<S.step||S.step===5;return `<li class="${cls}"><button type="button" data-go="${i}" ${can?'':'disabled'} ${i===S.step?'aria-current="step"':''}><span class="pbar"></span><span class="pk">STEP 0${i+1}</span><span class="pt">${t}</span></button></li>`}).join('')}</ol></nav>`}
const chip=(group,val,on)=>`<button type="button" class="chip" data-chip="${group}" data-val="${esc(val)}" aria-pressed="${on}">${esc(val)}</button>`;

function weekLine(){const t=total();if(!t)return '';return `<p class="howto">최근 7일 <b>${t}건</b> 중 감정 소비 <b>${S.cnt.feel}건</b>, 습관 소비 <b>${S.cnt.auto}건</b>이었어요. 비슷한 상황이 반복되진 않았나요?</p>`}
function tallyHTML(){const t=total();return `<div class="tl">총 ${t}건 <span>${t?TYPES.map(x=>x.n+' '+Math.round(S.cnt[x.k]/t*100)+'%').join(' · '):'+ 버튼을 눌러 세어보세요'}</span></div><div class="stack" aria-hidden="true">${t?TYPES.map(x=>`<i style="width:${S.cnt[x.k]/t*100}%;background:${TCOL[x.k]}"></i>`).join(''):''}</div>`}
function stepW(){return `<section class="step"><p class="eyebrow">STEP 01 · 7일 분류</p><h2>최근 7일, 내 소비는 어떤 모양일까?</h2>
<p class="lead">카드·페이 앱에서 최근 7일 결제 내역을 열어주세요. 한 건씩 보면서 네 가지 중 어디에 들어가는지 + 를 눌러요.</p>
<p class="howto"><b>이렇게 해요</b><br>① 카드 앱·간편결제 앱의 이용 내역 열기<br>② 위에서부터 한 건씩, 해당 칸에 + 누르기<br>③ 헷갈리면 가장 가까운 칸에. 금액은 세지 않아도 돼요</p>
<div class="card">
<div class="counters">${TYPES.map(t=>`<div class="ctr"><i>${t.e}</i><b>${t.n} 소비</b><small>${t.d}</small><div class="row"><button type="button" data-cnt="${t.k}" data-d="-1" aria-label="${t.n} 소비 하나 빼기">−</button><output id="c-${t.k}" aria-live="polite">${S.cnt[t.k]}</output><button type="button" class="plus" data-cnt="${t.k}" data-d="1" aria-label="${t.n} 소비 하나 더하기">+</button></div></div>`).join('')}</div>
<div class="tally" id="tally">${tallyHTML()}</div>
<div class="field" style="margin-top:20px"><label class="label" for="f-note">내역을 보며 눈에 띈 점 <small>선택</small></label><input id="f-note" class="input" data-f="note" maxlength="40" value="${esc(S.note)}" placeholder="예: 배달이 일주일에 4번이나 있었어요"><div class="count">${S.note.length}/40</div></div>
</div></section>`}
function step0(){return `<section class="step"><p class="eyebrow">STEP 02 · 무엇을</p><h2>그중 한 건만 깊게 볼까요?</h2>
<p class="lead">방금 본 7일 내역 중에서 가장 마음에 걸리는 소비 하나를 골라요. 감정·습관 칸에 넣은 것 중에서 고르면 좋아요.</p>
<div class="card">
<div class="field"><label class="label" for="f-item">산 것</label><input id="f-item" class="input" data-f="item" maxlength="30" value="${esc(S.item)}" placeholder="예: 배달 떡볶이"><div class="count">${S.item.length}/30</div></div>
<div class="field"><label class="label" for="f-date">언제 <small>날짜와 시간대</small></label><input id="f-date" class="input" type="date" data-f="date" value="${esc(S.date)}">
<div class="chips" role="group" aria-label="시간대">${TIMES.map(t=>chip('time',t,S.time===t)).join('')}</div></div>
<div class="field"><label class="label" for="f-amount">얼마였나요? <small>선택</small></label><div class="money"><input id="f-amount" class="input" inputmode="numeric" data-f="amount" value="${esc(fmtWon(S.amount))}" placeholder="예: 18,000"><span>원</span></div>
<label class="toggle"><input type="checkbox" data-f="hideAmount" ${S.hideAmount?'checked':''}>인증 이미지에는 금액 숨기기</label></div>
<div class="field"><label class="label" for="f-where">어디서, 누구랑? <small>선택</small></label><input id="f-where" class="input" data-f="where" maxlength="30" value="${esc(S.where)}" placeholder="예: 집에서 혼자, 퇴근하고"></div>
</div></section>`}
function step1(){return `<section class="step"><p class="eyebrow">STEP 03 · 그때 나는</p><h2>그 순간, 어떤 기분이었나요?</h2>
<p class="lead">해당하는 걸 모두 골라요. 기분과 이유 중 하나만 골라도 다음으로 갈 수 있어요.</p>
<div class="card">
<div class="field"><p class="label">그때 내 기분은</p><div class="chips" role="group" aria-label="기분">${FEELINGS.map(t=>chip('feel',t,S.feel.includes(t))).join('')}</div></div>
<div class="field"><p class="label">왜 사고 싶었나요</p><div class="chips" role="group" aria-label="이유">${REASONS.map(t=>chip('reason',t,S.reason.includes(t))).join('')}</div></div>
<div class="field"><label class="label" for="f-why">한 줄로 적어보면 <small>선택</small></label><input id="f-why" class="input" data-f="why" maxlength="50" value="${esc(S.why)}" placeholder="예: 야근하고 와서 아무것도 하기 싫었어요"><div class="count">${S.why.length}/50</div></div>
</div></section>`}
function step2(){const emo=S.feel.some(f=>['지침·피곤','스트레스','심심함','불안·조급','외로움','비교·부러움'].includes(f))||S.reason.includes('나한테 주는 보상');
const hint=S.type&&S.type!=='feel'&&emo?`<p class="hint" role="note">앞에서 고른 기분을 보면, 혹시 감정 소비였을 수도 있어요. 정답은 없으니 한 번만 더 생각해보고 골라요.</p>`:'';
return `<section class="step"><p class="eyebrow">STEP 04 · 돈값</p><h2>이 소비, 돈값 했나요?</h2>
<p class="lead">비싸도 돈값 하면 잘 쓴 소비, 싸도 방치되면 아까운 소비예요. 기준은 금액이 아니라 돈값이에요.</p>
<div class="card">
<div class="field"><p class="label">어떤 유형인가요 <small>하나만</small></p><div class="types" role="group" aria-label="소비 유형">${TYPES.map(t=>`<button type="button" class="type" data-type="${t.k}" aria-pressed="${S.type===t.k}"><i>${t.e}</i><b>${t.n}</b><span>${t.d}</span></button>`).join('')}</div>${hint}</div>
<div class="field"><p class="label">지금 이 물건(경험)은 <small>선택</small></p><div class="chips" role="group" aria-label="지금 상태">${STATUS.map(t=>chip('status',t,S.status===t)).join('')}</div></div>
<div class="field"><p class="label">솔직히, 값어치 있었나요</p><div class="worth" role="group" aria-label="돈값">${WORTH.map(w=>`<button type="button" data-worth="${w.k}" aria-pressed="${S.worth===w.k}"><em>${w.s}</em>${w.n}</button>`).join('')}</div></div>
<div class="field"><label class="label" for="f-ww">그렇게 느낀 이유 <small>선택</small></label><input id="f-ww" class="input" data-f="worthWhy" maxlength="50" value="${esc(S.worthWhy)}" placeholder="예: 먹을 땐 좋았는데 다음 날 후회했어요"><div class="count">${S.worthWhy.length}/50</div></div>
</div></section>`}
function suggestions(){const out=[];S.feel.forEach(f=>TRIG[f]&&out.push(TRIG[f]));S.reason.forEach(r=>RTRIG[r]&&out.push(RTRIG[r]));return [...new Set(out)].slice(0,4)}
function step3(){const sg=suggestions();return `<section class="step"><p class="eyebrow">STEP 05 · 깨달음</p><h2>나는 언제 지갑이 열릴까?</h2>
<p class="lead">7일 분류 결과와 오늘 쓴 일기를 같이 보고, 나만의 '지갑 트리거'를 한 문장으로 적어요.</p>
${weekLine()}
<div class="card">
<div class="field"><p class="label">나의 지갑 트리거</p>
<div class="sentence"><span>나는</span><input data-f="trigger" maxlength="24" value="${esc(S.trigger)}" placeholder="야근하고 지쳐서 집에 왔을" aria-label="지갑이 열리는 순간"><span>때 지갑이 열린다</span></div>
${sg.length?`<p class="sugg">고른 기분으로 만든 예시예요. 눌러서 고쳐 써도 돼요.</p><div class="chips">${sg.map(t=>`<button type="button" class="chip" data-sugg="${esc(t)}" aria-pressed="false">${esc(t)} 때</button>`).join('')}</div>`:''}
</div>
<div class="field"><label class="label" for="f-next">다음에 비슷한 상황이 오면 <small>선택</small></label><textarea id="f-next" class="input" data-f="next" maxlength="60" placeholder="예: 야근하는 날을 위해 간편식을 미리 사둘래요">${esc(S.next)}</textarea><div class="count">${S.next.length}/60</div></div>
</div></section>`}
function result(){return `<section class="step"><p class="eyebrow">RESULT</p><h2>나의 DAY 04 소비일기</h2>
<p class="lead">인증 이미지를 저장해서 톡방에 올려주세요. 계속 기록하고 싶다면 소비일기 양식도 받아가세요.</p>
<div class="preview"><canvas id="cv" width="1080" height="1350" aria-label="소비일기 인증 이미지 미리보기"></canvas><p>1080px 너비 PNG · 사진 앱에 저장하거나 톡방에 바로 올려요.</p></div>
<div class="actions">
<button type="button" class="btn primary" id="dl">인증 이미지 저장 ↓</button>
<a class="btn outline" href="spending-diary.pdf" download="MONEY_FREE_LAB_소비일기_양식.pdf">소비일기 PDF 양식 받기 (인쇄·아이패드용)</a>
</div>
<p class="note">${S.amount&&!S.hideAmount?'<b>인증 이미지에 금액이 들어가요.</b> 숨기려면 STEP 02에서 체크해 주세요. ':''}이 결과는 교육 목적의 기록이며, 입력 내용은 이 기기에만 저장돼요.</p>
<div class="nav"><button type="button" class="btn ghost" data-go="4">← STEP 05로</button><button type="button" class="linkbtn" id="reset">처음부터 다시 하기 (입력 기록 삭제)</button></div>
</section>`}

function render(){
 const views=[stepW,step0,step1,step2,step3,result];
 let html=(S.step===0?hero():'')+progress()+views[S.step]();
 if(S.step<5){html+=`<p class="err" id="err" aria-live="polite"></p><div class="nav">${S.step>0?'<button type="button" class="btn ghost" data-go="'+(S.step-1)+'">이전</button>':''}<button type="button" class="btn primary" id="next">${S.step===4?'결과 보기':'다음'}</button></div>`}
 app.innerHTML=html;
 if(S.step===5)draw();
}
function msg(i){return ['최소 3건 이상 분류해 주세요. 내역이 적다면 최근 2주로 늘려도 돼요.','산 것을 적어주세요.','기분이나 이유를 하나 이상 골라주세요.','유형과 돈값을 골라주세요.','지갑 트리거 문장을 채워주세요.'][i]}
app.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;const er=document.getElementById('err');if(er)er.textContent='';
 if(f==='hideAmount'){S.hideAmount=e.target.checked}
 else if(f==='amount'){const raw=e.target.value.replace(/[^0-9]/g,'').slice(0,9);S.amount=raw;const pos=e.target.value.length;e.target.value=fmtWon(raw)}
 else{S[f]=e.target.value;const c=e.target.parentElement.querySelector('.count')||e.target.closest('.field')?.querySelector('.count');if(c){const m=e.target.maxLength;c.textContent=e.target.value.length+'/'+m}}
 save()});
app.addEventListener('change',e=>{if(e.target.dataset.f==='hideAmount'){S.hideAmount=e.target.checked;save()}});
app.addEventListener('click',e=>{
 const b=e.target.closest('button,a');if(!b)return;
 if(b.dataset.go!==undefined){S.step=Number(b.dataset.go);save();render();window.scrollTo(0,0);return}
 if(b.id==='next'){if(!valid(S.step)){document.getElementById('err').textContent=msg(S.step);return}S.step++;save();render();window.scrollTo(0,0);return}
 if(b.dataset.chip){const g=b.dataset.chip,v=b.dataset.val;
  if(g==='feel'||g==='reason'){const a=S[g];const i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v)}
  else{S[g]=S[g]===v?'':v}
  const er=document.getElementById('err');if(er)er.textContent='';save();if(g==='time'||g==='status'){b.parentElement.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(S[g]===c.dataset.val)))}else b.setAttribute('aria-pressed',String(S[g].includes(v)));return}
 if(b.dataset.cnt){const k=b.dataset.cnt;S.cnt[k]=Math.max(0,Math.min(99,S.cnt[k]+Number(b.dataset.d)));save();document.getElementById('c-'+k).textContent=S.cnt[k];document.getElementById('tally').innerHTML=tallyHTML();const er=document.getElementById('err');if(er)er.textContent='';return}
 if(b.dataset.type){S.type=S.type===b.dataset.type?'':b.dataset.type;save();const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(b.dataset.worth){S.worth=b.dataset.worth;save();b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.worth===S.worth)));return}
 if(b.dataset.sugg){S.trigger=b.dataset.sugg;save();const inp=app.querySelector('[data-f="trigger"]');inp.value=S.trigger;inp.focus();return}
 if(b.id==='dl'){download();return}
 if(b.id==='reset'){reset();return}
});

/* ---------- 인증 이미지 ---------- */
function wrap(ctx,text,maxW){const out=[];String(text).split('\n').forEach(par=>{let line='';const words=par.split(' ');for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width<=maxW){line=t;continue}if(line)out.push(line);if(ctx.measureText(w).width<=maxW){line=w}else{let cur='';for(const ch of w){if(ctx.measureText(cur+ch).width>maxW){out.push(cur);cur=ch}else cur+=ch}line=cur}}out.push(line)});return out}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
const F=(w,s)=>`${w} ${s}px "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", sans-serif`;
async function draw(){
 const cv=document.getElementById('cv');if(!cv)return;const c=cv.getContext('2d');
 try{await Promise.all([document.fonts.load(F(800,40)),document.fonts.load(F(600,30))])}catch(e){}
 const W=1080,H=cv.height,P=72;c.clearRect(0,0,W,H);
 c.fillStyle='#080808';c.fillRect(0,0,W,H);
 c.textBaseline='alphabetic';if('letterSpacing' in c)c.letterSpacing='-1px';
 c.fillStyle='#F5F5F5';c.font=F(800,26);c.fillText('MONEY FREE LAB',P,92);
 c.fillStyle='#A3A3A3';c.font=F(600,24);c.textAlign='right';c.fillText('DAY 04 / MISSION',W-P,92);c.textAlign='left';
 c.fillStyle='#303030';c.fillRect(P,118,W-P*2,2);
 c.fillStyle='#F5F5F5';c.font=F(800,76);if('letterSpacing' in c)c.letterSpacing='-4px';c.fillText('MY SPENDING',P,222);
 c.fillStyle='#14FA32';c.fillText('DIARY',P,302);if('letterSpacing' in c)c.letterSpacing='-1px';
 c.fillStyle='#A3A3A3';c.font=F(600,26);c.fillText('DAY 04. 소비는 감정이다',P,352);
 let y=400;
 // 7일 분류
 {const t=total();const hW=W-P*2;const bh=t?250:0;
  if(t){c.fillStyle='#141414';rr(c,P,y,hW,bh,28);c.fill();
  c.fillStyle='#14FA32';c.font=F(800,22);c.fillText('01  최근 7일 분류',P+40,y+56);
  c.fillStyle='#A3A3A3';c.font=F(600,24);c.textAlign='right';c.fillText('총 '+t+'건',W-P-40,y+56);c.textAlign='left';
  const bx=P+40,bw=hW-80,by=y+84;c.save();rr(c,bx,by,bw,30,10);c.clip();let x=bx;TYPES.forEach(tp=>{const w=bw*S.cnt[tp.k]/t;c.fillStyle=TCOL[tp.k];c.fillRect(x,by,w,30);x+=w});c.restore();
  const cw=bw/4;TYPES.forEach((tp,i)=>{const cx=bx+i*cw;c.fillStyle=TCOL[tp.k];rr(c,cx,by+66,18,18,5);c.fill();c.fillStyle='#F5F5F5';c.font=F(800,28);c.fillText(tp.n,cx+28,by+84);c.fillStyle='#A3A3A3';c.font=F(700,28);c.fillText(S.cnt[tp.k]+'건',cx+28,by+124)});
  y+=bh+20}}
 // 무엇을
 const box=(h)=>{c.fillStyle='#141414';rr(c,P,y,W-P*2,h,28);c.fill()};
 const when=[dateLabel(S.date),S.time].filter(Boolean).join(' ');
 const amt=S.amount&&!S.hideAmount?fmtWon(S.amount)+'원':'';
 c.font=F(800,44);const itemLines=wrap(c,S.item||'-',W-P*2-80).slice(0,2);
 const h1=56+28+itemLines.length*56+(amt||S.where?44:0)+30;box(h1);
 c.fillStyle='#14FA32';c.font=F(800,22);c.fillText('02  무엇을',P+40,y+56);
 c.fillStyle='#A3A3A3';c.font=F(600,22);c.textAlign='right';c.fillText(when,W-P-40,y+56);c.textAlign='left';
 c.fillStyle='#F5F5F5';c.font=F(800,44);itemLines.forEach((l,i)=>c.fillText(l,P+40,y+56+28+44+i*56));
 if(amt||S.where){c.fillStyle='#A3A3A3';c.font=F(600,26);c.fillText([amt,S.where].filter(Boolean).join(' · '),P+40,y+56+28+44+itemLines.length*56)}
 y+=h1+20;
 // 기분 · 이유
 const tags=[...S.feel,...S.reason];c.font=F(700,26);
 let rows=[[]],rw=0;const maxW=W-P*2-80;tags.forEach(t=>{const w=c.measureText(t).width+44;if(rw+w>maxW&&rows[rows.length-1].length){rows.push([]);rw=0}rows[rows.length-1].push([t,w]);rw+=w+12});
 rows=rows.slice(0,3);const h2=56+20+rows.length*60+(S.why?52:0)+26;box(h2);
 c.fillStyle='#14FA32';c.font=F(800,22);c.fillText('03  그때 나는',P+40,y+56);
 let ty=y+56+20;rows.forEach(r=>{let tx=P+40;r.forEach(([t,w])=>{const isFeel=S.feel.includes(t);c.fillStyle=isFeel?'#1E1E1E':'transparent';rr(c,tx,ty,w,46,23);if(isFeel)c.fill();c.strokeStyle=isFeel?'#1E1E1E':'#3a3a3a';c.lineWidth=2;c.stroke();c.fillStyle='#F5F5F5';c.font=F(700,26);c.fillText(t,tx+22,ty+32);tx+=w+12});ty+=60});
 if(S.why){c.fillStyle='#A3A3A3';c.font=F(600,26);const l=wrap(c,'“'+S.why+'”',maxW)[0];c.fillText(l,P+40,ty+30)}
 y+=h2+20;
 // 유형 · 돈값
 const half=(W-P*2-20)/2;const h3=170;
 const t=TYPES.find(x=>x.k===S.type)||{n:'-',e:''};const isFeel=false;
 c.fillStyle=isFeel?'#14FA32':'#141414';rr(c,P,y,half,h3,28);c.fill();
 c.fillStyle=isFeel?'#03210A':'#14FA32';c.font=F(800,22);c.fillText('04  유형',P+40,y+56);
 c.fillStyle=isFeel?'#03210A':'#F5F5F5';c.font=F(800,60);c.fillText(t.n+' 소비',P+40,y+132);
 const w=WORTH.find(x=>x.k===S.worth)||{s:'',n:'-'};
 c.fillStyle='#141414';rr(c,P+half+20,y,half,h3,28);c.fill();
 c.fillStyle='#14FA32';c.font=F(800,22);c.fillText('돈값',P+half+60,y+56);
 c.fillStyle='#F5F5F5';c.font=F(800,60);c.fillText(w.s+' '+w.n,P+half+60,y+132);
 y+=h3+20;
 // 트리거
 c.font=F(800,46);const trig=wrap(c,'나는 '+(S.trigger||'___')+' 때 지갑이 열린다',W-P*2-80).slice(0,3);
 c.font=F(600,26);const nx=S.next?wrap(c,'다음엔 → '+S.next,W-P*2-80).slice(0,2):[];
 const h4=56+24+trig.length*60+(nx.length?nx.length*38+22:0)+34;
 c.fillStyle='#F5F5F5';rr(c,P,y,W-P*2,h4,28);c.fill();
 c.fillStyle='#03210A';c.fillStyle='#0B0B0B';c.font=F(800,22);c.fillText('05  나의 지갑 트리거',P+40,y+56);
 c.font=F(800,46);trig.forEach((l,i)=>{const yy=y+56+24+46+i*60;c.fillStyle='#14FA32';const lw=c.measureText(l).width;c.fillRect(P+36,yy-6,lw+8,16);c.fillStyle='#0B0B0B';c.fillText(l,P+40,yy)});
 c.fillStyle='#4A4A47';c.font=F(600,26);nx.forEach((l,i)=>c.fillText(l,P+40,y+56+24+trig.length*60+30+i*38));
 y+=h4;
 // footer
 c.fillStyle='#6B6B6B';c.font=F(600,20);c.fillText('MONEY FREE LAB · 머니프리랩',P,H-56);c.textAlign='right';c.fillText('소비는 감정이다',W-P,H-56);c.textAlign='left';
 // 높이 넘치면 캔버스 늘리기
 if(y>H-100&&!cv.dataset.grown){cv.dataset.grown='1';cv.height=Math.ceil((y+140)/10)*10;return draw()}
}
async function download(){
 const cv=document.getElementById('cv');await draw();
 cv.toBlob(async blob=>{if(!blob)return;const name='MONEY_FREE_LAB_DAY04_MISSION.png';const file=new File([blob],name,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})&&/iPhone|iPad|Android/i.test(navigator.userAgent)){try{await navigator.share({files:[file],title:'DAY 04 소비일기'});return}catch(e){if(e&&e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)},'image/png');
}
render();
})();
</script>

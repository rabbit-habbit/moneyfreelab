<body>
<header class="topbar"><div class="wrap"><span class="brand">MONEY FREE LAB</span><span class="day">DAY 19 / 대출 한도 계산기</span></div></header>
<main class="wrap" id="app"></main>
<p class="toast" id="toast" role="status" aria-live="polite"></p>
<footer><div class="wrap">© MONEY FREE LAB | 머니프리랩 제작<br>교육용 단순 계산이라 실제 은행 심사와 다를 수 있어요. 집을 살 땐 계약 전에 은행 상담을 꼭 먼저 받으세요.<br>입력한 숫자는 서버로 보내지 않고 이 기기에만 저장되며, 30일이 지나면 자동으로 지워져요.</div></footer>

<script>
(function(){
/* ---------- 기준 숫자 (2026년 11월 확인) ---------- */
const RULE={
 asOf:'2026년 11월 기준',
 rateDefault:4.88,           // 예금은행 주담대 평균(신규취급, 2026년 9월, 한국은행)
 rateSource:'주담대 평균 4.88% (한국은행, 2026년 9월)',
 dsr:0.40,                   // 은행권 DSR
 stress:{reg:3.0,metro:3.0,local:0.75},   // 변동형 기준. 지방은 1.5%p × 50%
 rtypes:[{k:'cyc5',n:'5년 주기형',d:'5년마다 금리가 바뀌어요',f:0.3},{k:'mix5',n:'5년 혼합형',d:'5년 고정, 그 뒤 변동',f:0.6},{k:'var',n:'변동금리',d:'금리가 수시로 바뀌어요',f:1}], // 스트레스 금리 반영 비율
 ltv:{reg:[0.40,0.70],metro:[0.70,0.70],local:[0.70,0.80]}, // [일반, 생애최초]
 creditRate:6.5              // 마이너스통장 DSR 계산용 금리(대략)
};
const REGIONS=[
 {k:'reg',n:'규제지역',d:'서울 전역 · 경기 일부(과천·광명·분당·동탄 등)'},
 {k:'metro',n:'수도권 비규제',d:'규제지역이 아닌 경기·인천'},
 {k:'local',n:'지방',d:'수도권 밖'}];
const KEY='mfl-day19-loan-v1',TTL=30*24*3600*1000;
const blank=()=>({v:1,saved:Date.now(),price:'',region:'reg',first:true,income:'',other:'',mt:'',seed:'',rate:String(RULE.rateDefault),rtype:'cyc5',years:30,net:'',mask:false,line:'',lineEdited:false});
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&r.v===1&&Date.now()-r.saved<TTL)return Object.assign(blank(),r)}catch(e){}return blank()}
function save(){S.saved=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=Number(String(v).replace(/[^0-9.]/g,''));return isFinite(n)?n:0};
const comma=v=>{const n=Number(String(v).replace(/[^0-9]/g,''));return n?n.toLocaleString('ko-KR'):''};
const UA=navigator.userAgent||'';
const IN_KAKAO=/KAKAOTALK/i.test(UA);
const IN_APP=IN_KAKAO||/NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp/i.test(UA);

/* ---------- 금액 표시 (단위: 만원) ---------- */
function eok(m){m=Math.round(m);if(Math.abs(m)>=10000){let t=(Math.abs(m)/10000).toFixed(2).replace(/0$/,'').replace(/\.0$/,'');return (m<0?'-':'')+t+'억'}return Math.round(m).toLocaleString('ko-KR')+'만'}
function eok1(m){m=Math.round(m);if(Math.abs(m)>=10000){return (Math.round(Math.abs(m)/1000)/10).toString()+'억'}return Math.round(m).toLocaleString('ko-KR')+'만 원'}
function full(m){m=Math.round(Math.abs(m));const e=Math.floor(m/10000),r=m%10000;if(!m)return '0원';return (e?e+'억':'')+(e&&r?' ':'')+(r?r.toLocaleString('ko-KR')+'만':'')+' 원'}
function band(m){m=Math.abs(m);if(m>=10000)return Math.floor(m/10000)+'억대';if(m>=1000)return Math.floor(m/1000)+'천만 원대';if(m>=100)return Math.floor(m/100)+'백만 원대';return Math.round(m)+'만 원'}
function bandMonthly(m){if(m>=100)return Math.floor(m/100)+'백만 원대';if(m>=10)return Math.floor(m/10)+'0만 원대';return Math.round(m)+'만 원'}
function bandPct(p){return Math.floor(p/10)*10+'%대'}

/* ---------- 계산 ---------- */
function pv(pay,r,n){return r>0?pay*(1-Math.pow(1+r,-n))/r:pay*n}
function pmt(p,r,n){return r>0?p*r/(1-Math.pow(1+r,-n)):p/n}
function acqTax(price,first){ // 1주택 유상취득, 85㎡ 이하 가정
 const e=price/10000;let rate=e<=6?0.01:e<=9?(e*2/3-3)/100:0.03;
 let tax=price*rate+price*rate*0.1; // 취득세 + 지방교육세
 if(first&&price<=120000)tax-=Math.min(200,price*rate); // 생애최초 감면 최대 200만
 return Math.max(0,tax)}
function brokerFee(price){ // 매매 중개보수 상한 + 부가세
 let f;if(price<5000)f=Math.min(price*0.006,25);else if(price<20000)f=Math.min(price*0.005,80);else if(price<90000)f=price*0.004;else if(price<120000)f=price*0.005;else if(price<150000)f=price*0.006;else f=price*0.007;
 return f*1.1}
const NET=[[1500,125],[2400,185],[3000,230],[3600,272],[4000,298],[5000,360],[6000,410],[7000,466],[8000,520],[9000,574],[10000,628],[12000,725],[15000,870],[20000,1100],[30000,1560]];
function estNet(inc){if(inc<=0)return 0;if(inc<=NET[0][0])return inc/12*0.98;for(let i=1;i<NET.length;i++){const[a,x]=NET[i-1],[b,y]=NET[i];if(inc<=b)return x+(y-x)*(inc-a)/(b-a)}return inc/12*0.62}
function capOf(price,region){return region==='local'?null:(price<=150000?60000:price<=250000?40000:20000)}
function limits(price,p){
 const ltv=Math.max(0,price*RULE.ltv[p.region][p.first?1:0]);
 const cap=capOf(price,p.region);
 const cands=[{k:'ltv',v:ltv},{k:'dsr',v:p.dsrMax}];if(cap!==null)cands.push({k:'cap',v:cap});
 let low=cands[0];cands.forEach(c=>{if(c.v<low.v)low=c});
 return {ltv,cap,dsr:p.dsrMax,limit:Math.max(0,Math.min(low.v,price)),low:low.k}}
function calc(){
 const price=num(S.price),income=num(S.income),other=num(S.other),mt=num(S.mt),seed=num(S.seed);
 const rate=Math.min(Math.max(num(S.rate),0),20),years=S.region==='local'?S.years:30,n=years*12;
 const RT=RULE.rtypes.find(t=>t.k===S.rtype)||RULE.rtypes[0];
 const stress=Math.round(RULE.stress[S.region]*RT.f*100)/100;
 const otherAnnual=other*12+(mt?mt/5+mt*RULE.creditRate/100:0);
 const room=Math.max(0,income*RULE.dsr-otherAnnual); // 1년에 주담대로 갚을 수 있는 돈
 const dsrMax=pv(room/12,(rate+stress)/1200,n);
 const p={region:S.region,first:S.first,dsrMax};
 const L=limits(price,p);
 const cost=price?acqTax(price,S.first)+brokerFee(price):0;
 const need=Math.max(0,price+cost-L.limit);
 const gap=seed-need;
 const monthly=L.limit?pmt(L.limit,rate/1200,n):0;

}
function autoLine(R){
 if(!R.ready)return '';
 const m=S.mask;
 const a=m?band(R.limit):'약 '+eok1(R.limit);
 let t=`내 대출 한도 ${a} (가장 낮은 천장: ${LOWNAME[R.low]}).`;
 t+=` 1순위 단지 ${m?band(R.price):eok1(R.price)}을 사려면 내 돈 ${m?band(R.need):eok1(R.need)} 필요`;
 if(R.hasSeed)t+=R.gap<0?` → 종잣돈보다 ${m?band(-R.gap):eok1(-R.gap)} 부족.`:` → 종잣돈으로 충분해요.`;else t+='.';
 t+=` 매달 ${m?bandMonthly(R.monthly):Math.round(R.monthly)+'만 원'}, 월급의 ${m?bandPct(R.pct):Math.round(R.pct)+'%'}.`;
 if(R.maxPrice)t+=` 내 진짜 예산은 ${m?band(R.maxPrice):'약 '+eok1(R.maxPrice)}.`;
 return t;
}

/* ---------- 이벤트 ---------- */
function bind(){
 app.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.f;if(!f)return;
  if(f==='line'){S.line=e.target.value;S.lineEdited=true;save();drawSoon();return}
  if(f==='first'||f==='mask'){S[f]=e.target.checked;update();return}
  if(f==='rate'){S.rate=e.target.value.replace(/[^0-9.]/g,'');update();return}
  const raw=e.target.value.replace(/[^0-9]/g,'').slice(0,7);S[f]=raw;
  const pos=e.target.value.length-e.target.selectionStart;e.target.value=comma(raw);try{const p=Math.max(0,e.target.value.length-pos);e.target.setSelectionRange(p,p)}catch(_){}
  const r=$('r-'+f);if(r)r.textContent=readOut(f);update()});
 app.addEventListener('change',e=>{const f=e.target.dataset&&e.target.dataset.f;if(f==='first'||f==='mask'){S[f]=e.target.checked;update()}});
 app.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.region){S.region=b.dataset.region;b.parentElement.querySelectorAll('.region').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.region===S.region)));update();return}
  if(b.dataset.rtype){S.rtype=b.dataset.rtype;b.parentElement.querySelectorAll('.region').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.rtype===S.rtype)));update();return}
  if(b.dataset.years){S.years=Number(b.dataset.years);update();if(S.years===40&&S.region!=='local')toast('수도권·규제지역은 30년으로 계산돼요');return}
  if(b.id==='sample'){Object.assign(S,{price:'85000',region:'reg',first:true,income:'6000',other:'',mt:'',seed:'30000',rtype:'cyc5',rate:String(RULE.rateDefault),years:30,net:'',lineEdited:false});render();$('ceilings').scrollIntoView({behavior:'smooth',block:'start'});return}
  if(b.id==='relines'){S.lineEdited=false;update();toast('자동 문장으로 되돌렸어요');return}
  if(b.id==='copy'){const ok=await copyText(S.line||'');toast(ok?'한 줄을 복사했어요':'복사가 안 되면 길게 눌러 복사해 주세요');return}
  if(b.id==='reset'){if(!confirmReset())return;S=blank();try{localStorage.removeItem(KEY)}catch(_){}render();window.scrollTo({top:0,behavior:'smooth'});toast('처음 상태로 돌렸어요');return}
  if(b.id==='ext'){openExternal();return}
  if(b.id==='dl'){saveImage();return}
 });
}
let resetArm=0;function confirmReset(){const now=Date.now();if(now-resetArm<4000){resetArm=0;return true}resetArm=now;toast('한 번 더 누르면 입력한 숫자가 모두 지워져요');return false}
function openExternal(){const u=location.href.split('#')[0];if(IN_KAKAO){location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(u);return}copyText(u).then(()=>toast('주소를 복사했어요. 크롬·사파리 주소창에 붙여넣어 주세요'))}
let tt;function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2000)}
function copyText(t){return new Promise(res=>{const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();res(ok)};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>res(true),fb);else fb()})}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}

/* ---------- 인증 이미지 ---------- */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
const FT=(w,s)=>`${w} ${s}px "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", sans-serif`;
let dt;function drawSoon(){clearTimeout(dt);dt=setTimeout(draw,150)}
async function draw(){
 const cv=$('cv');if(!cv)return;const c=cv.getContext('2d');try{await Promise.all([document.fonts.load(FT(800,40)),document.fonts.load(FT(600,30))])}catch(e){}
 const R=calc(),m=S.mask,W=1080,H=1490,P=72;
 const LS=v=>{if('letterSpacing' in c)c.letterSpacing=v};
 const V=(x,kind)=>m?(kind==='mo'?bandMonthly(x):kind==='pct'?bandPct(x):band(x)):(kind==='mo'?Math.round(x).toLocaleString('ko-KR')+'만 원':kind==='pct'?Math.round(x)+'%':eok(x));
 c.fillStyle='#F5F5F0';c.fillRect(0,0,W,H);c.textBaseline='alphabetic';LS('-1px');
 const lab=(tx,x,yy)=>{c.font=FT(800,22);const w=c.measureText(tx).width;c.fillStyle='#14FA32';rr(c,x-12,yy-28,w+24,38,19);c.fill();c.fillStyle='#0B0B0B';c.fillText(tx,x,yy)};
 const card=(x,yy,w,h,strong)=>{c.fillStyle='#FFFFFF';rr(c,x,yy,w,h,28);c.fill();c.strokeStyle=strong?'#0B0B0B':'#E2E2DC';c.lineWidth=strong?3:2;c.stroke()};
 c.fillStyle='#111111';c.font=FT(800,26);c.fillText('MONEY FREE LAB',P,92);
 c.fillStyle='#5F5F59';c.font=FT(600,24);c.textAlign='right';c.fillText('DAY 19 / MISSION',W-P,92);c.textAlign='left';
 c.fillStyle='#DDDDD6';c.fillRect(P,118,W-P*2,2);
 LS('-4px');c.fillStyle='#111111';c.font=FT(800,76);c.fillText('MY LOAN',P,222);{const rw=c.measureText('LIMIT').width;c.fillStyle='#14FA32';c.fillRect(P-4,272,rw+12,36)}c.fillStyle='#111111';c.fillText('LIMIT',P,302);LS('-1px');
 c.fillStyle='#5F5F59';c.font=FT(600,24);c.fillText('DAY 19. 대출 용어와 전략 · 내 첫 집 계획표 ④',P,352);
 let y=396;
 if(!R.ready){card(P,y,W-P*2,200);c.fillStyle='#8C8C85';c.font=FT(700,30);c.fillText('숫자를 넣으면 여기에 결과가 나와요',P+40,y+112);return}
 // 01 세 개의 천장
 const rows=[['LTV',R.ltv,'ltv']];if(R.cap!==null)rows.push(['정부 상한',R.cap,'cap']);rows.push(['DSR',R.dsr,'dsr']);
 const ch=96+rows.length*64+20;card(P,y,W-P*2,ch);lab('01 세 개의 천장',P+40,y+58);
 c.fillStyle='#5F5F59';c.font=FT(600,22);c.textAlign='right';c.fillText(REGIONS.find(r=>r.k===S.region).n+(S.first?' · 생애최초':'')+' · '+R.rtName,W-P-40,y+56);c.textAlign='left';
 const mx=Math.max(...rows.map(r=>r[1]),1),bx=P+190,bw=W-P*2-230;
 rows.forEach((r,i)=>{const yy=y+96+i*64;c.fillStyle='#111111';c.font=FT(800,28);c.fillText(r[0],P+40,yy+30);
  c.fillStyle='#EDEDE6';rr(c,bx,yy,bw,44,14);c.fill();const w=Math.max(120,bw*r[1]/mx);const low=r[2]===R.low;
  c.fillStyle=low?'#14FA32':'#CBCBC4';rr(c,bx,yy,w,44,14);c.fill();if(low){c.strokeStyle='#0B0B0B';c.lineWidth=3;c.stroke()}
  c.fillStyle='#0B0B0B';c.font=FT(800,26);c.fillText(V(r[1])+(low?'  ← 가장 낮은 천장':''),bx+20,yy+31)});
 y+=ch+20;
 // 02 · 03
 const hw=(W-P*2-20)/2,h2=200;card(P,y,hw,h2,true);lab('02 내 대출 한도',P+40,y+58);
 LS('-3px');c.font=FT(800,64);const lt=(m?'':'약 ')+V(R.limit);const lw=c.measureText(lt).width;c.fillStyle='#14FA32';c.fillRect(P+36,y+126,lw+8,22);c.fillStyle='#0B0B0B';c.fillText(lt,P+40,y+144);LS('-1px');
 c.fillStyle='#5F5F59';c.font=FT(600,22);c.fillText('가장 낮은 천장: '+LOWNAME[R.low],P+40,y+180);
 card(P+hw+20,y,hw,h2);lab('03 필요한 내 돈',P+hw+60,y+58);
 LS('-3px');c.fillStyle='#0B0B0B';c.font=FT(800,64);c.fillText(V(R.need),P+hw+60,y+144);LS('-1px');
 c.fillStyle='#5F5F59';c.font=FT(600,22);c.fillText('집값 '+(m?band(R.price):eok(R.price))+' + 부대비용 − 대출',P+hw+60,y+180);
 y+=h2+20;
 // 부족 바
 c.fillStyle='#111111';rr(c,P,y,W-P*2,120,28);c.fill();
 c.fillStyle='#FFFFFF';c.font=FT(700,30);c.fillText(R.hasSeed?'종잣돈 '+(m?band(R.seed):eok(R.seed))+(R.gap<0?'보다':'으로'):'종잣돈을 넣으면 나와요',P+40,y+72);
 if(R.hasSeed){c.fillStyle='#14FA32';c.font=FT(800,50);c.textAlign='right';c.fillText(R.gap<0?V(-R.gap)+' 부족':V(R.gap)+' 남아요',W-P-40,y+78);c.textAlign='left'}
 y+=140;
 // 04 매달
 card(P,y,W-P*2,150);lab('04 매달 갚을 돈',P+40,y+58);
 c.fillStyle='#0B0B0B';c.font=FT(800,46);c.fillText(V(R.monthly,'mo'),P+40,y+118);c.textAlign='right';c.fillText('월급의 '+V(R.pct,'pct'),W-P-40,y+118);c.textAlign='left';
 y+=170;
 // 05 내 진짜 예산
 card(P,y,W-P*2,132,true);lab('05 내 진짜 예산',P+40,y+58);
 c.fillStyle='#0B0B0B';c.font=FT(800,44);c.fillText((m?band(R.maxPrice):'약 '+eok(R.maxPrice))+'까지의 집',P+40,y+112);
 c.fillStyle='#8C8C85';c.font=FT(600,20);c.fillText('교육용 단순 계산 · '+RULE.asOf+' · 금리 '+R.rate+'% '+R.years+'년',P,H-56);c.textAlign='right';c.fillText('MONEY FREE LAB',W-P,H-56);c.textAlign='left';
}
async function saveImage(){await draw();const cv=$('cv');
 if(IN_APP){$('saveimg').src=cv.toDataURL('image/png');$('saveimgbox').hidden=false;$('saveimgbox').scrollIntoView({behavior:'smooth',block:'center'});return}
 cv.toBlob(async blob=>{if(!blob)return;const name='MONEY_FREE_LAB_DAY19_대출한도.png';const file=new File([blob],name,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})&&/iPhone|iPad|Android/i.test(UA)){try{await navigator.share({files:[file],title:'DAY 19 대출 한도'});return}catch(e){if(e&&e.name==='AbortError')return}}
  dl(blob,name)},'image/png')}

render();
})();

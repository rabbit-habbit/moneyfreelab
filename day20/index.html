<title>MONEY FREE LAB · DAY 20 나의 자산 로드맵</title>
<style>

@font-face{font-family:"Pretendard Variable";src:url("PretendardVariable.woff2") format("woff2");font-weight:45 920;font-display:swap}

*{box-sizing:border-box}

textarea.input{min-height:120px;resize:vertical;font-size:15px;font-weight:600;line-height:1.6;text-align:left}
.linkbtn{all:unset;cursor:pointer;font-size:13px;font-weight:800;color:var(--muted);text-decoration:underline}
.btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;border-radius:16px;padding:16px 18px;font-weight:800;font-size:16px;display:block;width:100%}

.toast.on{transform:translateX(-50%) translateY(0);visibility:visible}
.toast:not(.on){visibility:hidden;transition:transform .25s,visibility 0s .25s}
footer{border-top:1px solid var(--line);margin-top:40px}
footer .wrap{padding-block:22px 40px;font-size:13px;color:var(--faint);line-height:1.7}

<body>
<header class="topbar"><div class="wrap"><span class="brand">MONEY FREE LAB</span><span class="day">DAY 20 / 나의 자산 로드맵</span></div></header>
<main class="wrap" id="app"></main>
<p class="toast" id="toast" role="status" aria-live="polite"></p>
<footer><div class="wrap">© MONEY FREE LAB | 머니프리랩 제작<br>교육용 단순 계산이에요. 특정 종목·단지·상품을 권하지 않아요. 집을 살 땐 계약 전에 은행 상담을 꼭 먼저 받으세요.<br>입력한 내용은 서버로 보내지 않고 이 기기에만 저장돼요.</div></footer>

<script>
(function(){
const KEY='mfl-day20-roadmap-v1';
const NOW=new Date(),Y0=NOW.getFullYear();
const blank=()=>({v:1,name:'',age:'',seedNow:'',living:'',save:'',debtRule:'',
 rate:'',fx:'',cycle:'',econ:'',econEdited:false,
 emerg:'',goal:'',long:'',brate:'3',grate:'5',emergGoal:'',emergHave:'',goalWhat:'',goalAmt:'',goalHave:'',longHave:'',core:'',coreIdx:'',sat:'',rule:'',
 apt1:'',apt1Price:'',apt2:'',apt2Price:'',methods:[],score:'',limit:'',maxPrice:'',need:'',
 route:'',years:'',tl:['','','',''],pledge:'',pledgeEdited:false,before:'',after:'',best:'',mask:false,line:'',lineEdited:false,imported:false});
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&r.v===1){const b=blank();const o=Object.assign(b,r);if(!Array.isArray(o.tl)||o.tl.length!==4)o.tl=['','','',''];if(!Array.isArray(o.methods))o.methods=[];return o}}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=Number(String(v==null?'':v).replace(/[^0-9.]/g,''));return isFinite(n)?n:0};
const comma=v=>{const n=Number(String(v==null?'':v).replace(/[^0-9]/g,''));return n?n.toLocaleString('ko-KR'):''};
const UA=navigator.userAgent||'';
const IN_KAKAO=/KAKAOTALK/i.test(UA);
const IN_APP=IN_KAKAO||/NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp/i.test(UA);

/* ---------- 세 칸 기간 ---------- */
function fillMonths(g,h,mo,safeA,invA){const rs=safeA/1200,ri=invA/1200;
 for(let n=1;n<=720;n++){let bal=h;for(let i=1;i<=n;i++){const r=(n-i>=60)?ri:rs;bal=bal*(1+r)+mo}if(bal>=g-1e-6)return n}return 721}
function bucket(goalAmt,have,mon,isGoal){const g=num(goalAmt),h=num(have),mo=num(mon);if(!g)return null;const rem=Math.max(0,g-h);
 if(!rem)return {done:true,rem:0,months:0};const sa=num(S.brate),ia=sa;
 const safeM=mo?fillMonths(g,h,mo,sa,sa):0,months=mo?fillMonths(g,h,mo,sa,ia):0;
 const plain=mo?Math.ceil(rem/mo):0;return {done:false,rem,months,mo,plain,safeM,rate:sa,inv:ia>sa&&months>60?ia:0}}
function bucketTxt(b,k){if(!b)return '';const V=x=>eok(x)+(x<10000?' 원':'');const sub=x=>'<br><span style="font-weight:600;color:var(--muted)">'+x+'</span>';
 if(b.done)return '✓ 목표 금액 다 찼어요. 매달 몫은 다른 칸으로 옮겨요';
 if(!b.months)return '남은 돈 '+V(b.rem)+' · 매달 넣을 돈을 적으면 기간이 나와요';
 if(b.months>720)return '남은 '+V(b.rem)+' · 매달 '+V(b.mo)+'로는 60년이 넘게 걸려요. 매달 넣을 돈이나 목표 금액을 다시 봐요';
 let t;
 if(b.inv){t='남은 '+V(b.rem)+' · 매달 '+V(b.mo)+sub('처음 '+ym(b.months-60)+'은 연 '+b.inv+'%로 굴리고, 마지막 5년은 예·적금 연 '+b.rate+'%로 지키면')+'<br>→ <em>약 '+ym(b.months)+' 뒤</em> 다 차요';
  if(b.safeM>b.months)t+=sub('예·적금으로만 모을 때('+ym(b.safeM)+')보다 '+ym(b.safeM-b.months)+' 빨라요')}
 else{t='남은 '+V(b.rem)+' · 매달 '+V(b.mo)+(b.rate?' + 이자 연 '+b.rate+'%':'')+' → <em>약 '+ym(b.months)+' 뒤</em> 다 차요';
  if(b.rate&&b.plain>b.months)t+=sub('이자 덕분에 '+ym(b.plain-b.months)+' 빨라졌어요')}
 if(k==='goal'&&b.months<=720){const b2=bucket(S.goalAmt,S.goalHave,String(b.mo+50),true);if(b2&&b2.months&&b2.months<b.months)t+=sub('매달 50만 원 더 넣으면 → 약 '+ym(b2.months)+' 뒤 ('+ym(b.months-b2.months)+' 빨라요)')}
 if(k==='goal'&&b.months>120&&b.months<=720)t+=sub('10년이 넘으면 모으기만으론 길어요. STEP 5에서 징검다리 · 조건 바꾸기도 같이 봐요');
 return t}

function wrapT(c,text,maxW,maxL){const out=[];let line='';for(const w of String(text||'').split(' ')){const t=line?line+' '+w:w;if(c.measureText(t).width<=maxW){line=t;continue}if(line)out.push(line);line=w}if(line)out.push(line);if(out.length>maxL){const k=out.slice(0,maxL);k[maxL-1]=fit(c,k[maxL-1]+' '+out.slice(maxL).join(' '),maxW);return k}return out}
